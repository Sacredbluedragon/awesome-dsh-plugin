name: Sacredbluedragon/dsh-bili-watch
category: tools
description:
  en: 'Reads bilibili video as structured text for AI: metadata, comments, danmaku, subtitles, local ASR, frame OCR. Local processing (no cloud upload), decoy-subtitle detection with frame check, instant re-reads via cache, AI-ready manifest + summary.'
  zh: '把 B 站视频解析成模型可消费的结构化内容：元数据、评论、弹幕、字幕、本地 ASR 转写、抽帧 OCR。本地跑不上传、字幕诱饵检测（可疑时抽帧核对）、二次读瞬时、输出 manifest + 摘要。'
